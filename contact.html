<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - SIG Trois-Rivières</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="contact.css" />
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">SIG Trois-Rivières</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Accueil</a></li>
        <li class="nav-item"><a class="nav-link" href="carte.html">Carte</a></li>
        <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<section class="contact-section">
  <div class="container">
    <h2 class="text-center mb-4"><i class="bi bi-envelope-paper-heart"></i> Contactez-nous</h2>
    <p class="text-center mb-5">N'hésitez pas à nous écrire si vous avez des questions concernant le projet ou souhaitez en savoir plus.</p>
    <form class="mx-auto" style="max-width: 600px;" onsubmit="handleSubmit(event)">
      <div class="mb-3">
        <label for="name" class="form-label"><i class="bi bi-person-fill"></i> Nom</label>
        <input type="text" class="form-control" id="name" placeholder="Votre nom" required />
      </div>
      <div class="mb-3">
        <label for="email" class="form-label"><i class="bi bi-envelope-fill"></i> Adresse e-mail</label>
        <input type="email" class="form-control" id="email" placeholder="exemple@mail.com" required />
      </div>
      <div class="mb-3">
        <label for="message" class="form-label"><i class="bi bi-chat-dots-fill"></i> Message</label>
        <textarea class="form-control" id="message" rows="4" placeholder="Votre message..." required></textarea>
      </div>
      <button type="submit" class="btn btn-primary w-100"><i class="bi bi-send-check-fill"></i> Envoyer</button>
    </form>
  </div>
</section>

<footer class="text-center mt-5 py-3 bg-dark text-light">
  <p>&copy; 2025 SIG Trois-Rivières – Tous droits réservés</p>
</footer>

<!-- Scripts -->
<script>
  function handleSubmit(event) {
    event.preventDefault();
    alert("✅ Merci pour votre message ! Nous vous répondrons sous peu.");
    event.target.reset();
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="contact.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
